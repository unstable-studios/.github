name: Setup pnpm
description: >-
  setup-node + pnpm with packageManager-aware version resolution, an explicit
  pnpm store cache, and the GitHub Packages lockfile guard. Shared by the
  org's reusable workflows so version-resolution and caching fixes land in
  one place.

inputs:
  node-version:
    description: "Node.js version"
    default: "22"
  pnpm-version:
    description: "pnpm version, used only when package.json has no pnpm packageManager pin"
    default: "10"
  registry-url:
    description: "npm registry URL for authentication (e.g. https://npm.pkg.github.com for GitHub Packages)"
    default: ""
  working-directory:
    description: "Directory whose .npmrc is checked in addition to the repo root"
    default: "."

runs:
  using: composite
  steps:
    # setup-node runs before pnpm/action-setup so the v6 self-installer runs
    # on the setup-node Node, not the runner default. cache: pnpm can't be
    # used in this order (pnpm isn't installed yet), so the store is cached
    # explicitly below.
    - uses: actions/setup-node@v7
      with:
        node-version: ${{ inputs.node-version }}
        registry-url: ${{ inputs.registry-url || '' }}

    # pnpm/action-setup aborts with "Multiple versions of pnpm specified"
    # when both its `version` input and a package.json `packageManager` field
    # are set. Defer to `packageManager` when the caller uses it (the Corepack
    # convention) and fall back to the input otherwise. Checks the root
    # package.json because that is the file the action itself reads,
    # regardless of any working-directory default.
    - name: Resolve pnpm version
      id: pnpm-version
      shell: bash
      run: |
        PKG="$GITHUB_WORKSPACE/package.json"
        if [ -f "$PKG" ] && PKG="$PKG" node -e 'const p = require(process.env.PKG); process.exit(typeof p.packageManager === "string" && p.packageManager.startsWith("pnpm@") ? 0 : 1)'; then
          echo "Using pnpm version from package.json packageManager"
          echo "version=" >> "$GITHUB_OUTPUT"
        else
          echo "version=$PNPM_VERSION" >> "$GITHUB_OUTPUT"
        fi
      env:
        PNPM_VERSION: ${{ inputs.pnpm-version }}

    - uses: pnpm/action-setup@v6
      with:
        version: ${{ steps.pnpm-version.outputs.version }}

    - name: Locate pnpm store
      id: pnpm-store
      shell: bash
      run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

    # GitHub-hosted runners only. Self-hosted runners (echo-turbine) keep the
    # store on the host (npm_config_store_dir for pnpm 10, pnpm_config_store_dir
    # for pnpm 11+), and uploading to GitHub's
    # cache from there took minutes per job.
    - name: Cache pnpm store
      if: runner.environment == 'github-hosted'
      uses: actions/cache@v6
      with:
        path: ${{ steps.pnpm-store.outputs.path }}
        key: pnpm-store-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
        restore-keys: pnpm-store-${{ runner.os }}-

    - name: Check GitHub Packages lockfile config
      shell: bash
      run: |
        # pnpm 10 reads lockfile-include-tarball-url from .npmrc; pnpm 11+
        # reads only auth and registry settings there, and takes
        # lockfileIncludeTarballUrl from pnpm-workspace.yaml instead
        for dir in "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/$WORKING_DIRECTORY"; do
          npmrc="$dir/.npmrc"
          [ -f "$npmrc" ] && grep -q 'npm.pkg.github.com' "$npmrc" || continue
          grep -q 'lockfile-include-tarball-url=true' "$npmrc" && continue
          grep -Eq '^lockfileIncludeTarballUrl:[[:space:]]*true' "$dir/pnpm-workspace.yaml" "$GITHUB_WORKSPACE/pnpm-workspace.yaml" 2>/dev/null && continue
          echo "::error file=$npmrc::.npmrc uses GitHub Packages but the lockfile doesn't record tarball URLs"
          echo "pnpm constructs incorrect tarball URLs for GitHub Packages without this setting."
          echo ""
          echo "Fix, then regenerate the lockfile (pnpm store prune && rm pnpm-lock.yaml && rm -rf node_modules && pnpm install):"
          echo "  pnpm 11 or later: 'lockfileIncludeTarballUrl: true' in pnpm-workspace.yaml"
          echo "  pnpm 10: 'lockfile-include-tarball-url=true' in .npmrc"
          echo ""
          echo "See: https://github.com/pnpm/pnpm/issues/7579"
          exit 1
        done
      env:
        WORKING_DIRECTORY: ${{ inputs.working-directory }}

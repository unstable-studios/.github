name: Publish npm

on:
  workflow_call:
    inputs:
      node-version:
        description: "Node.js version"
        type: string
        default: "22"
      pnpm-version:
        description: "pnpm version"
        type: string
        default: "10"
      registry-url:
        description: "npm registry URL"
        type: string
        default: "https://npm.pkg.github.com"
      package-filter:
        description: "pnpm --filter value for monorepo (empty for single package)"
        type: string
        default: ""
      build-script:
        description: "Build command before publish"
        type: string
        default: "pnpm build"
      pre-publish-script:
        description: "Script to run after build, before publish (empty to skip)"
        type: string
        default: ""
      dry-run:
        description: "Run publish in dry-run mode"
        type: boolean
        default: false

jobs:
  publish:
    runs-on: ${{ vars.RUNS_ON || 'ubuntu-latest' }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6

      # setup-node runs before pnpm/action-setup so the v6 self-installer runs
      # on the setup-node Node, not the runner default. cache: pnpm can't be
      # used in this order (pnpm isn't installed yet), so the store is cached
      # explicitly below.
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ inputs.node-version }}
          registry-url: ${{ inputs.registry-url }}

      # pnpm/action-setup aborts with "Multiple versions of pnpm specified"
      # when both its `version` input and a package.json `packageManager` field
      # are set. Defer to `packageManager` when the caller uses it (the Corepack
      # convention) and fall back to the input otherwise. Checks the root
      # package.json because that is the file the action itself reads,
      # regardless of any working-directory default.
      - name: Resolve pnpm version
        id: pnpm-version
        run: |
          PKG="$GITHUB_WORKSPACE/package.json"
          if [ -f "$PKG" ] && grep -qE '"packageManager"[[:space:]]*:[[:space:]]*"pnpm@' "$PKG"; then
            echo "Using pnpm version from package.json packageManager"
            echo "version=" >> "$GITHUB_OUTPUT"
          else
            echo "version=$PNPM_VERSION" >> "$GITHUB_OUTPUT"
          fi
        env:
          PNPM_VERSION: ${{ inputs.pnpm-version }}

      - uses: pnpm/action-setup@v6
        with:
          version: ${{ steps.pnpm-version.outputs.version }}

      - name: Locate pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        if: inputs.build-script != ''
        run: |
          FILTER="${{ inputs.package-filter }}"
          if [ -n "$FILTER" ]; then
            pnpm --filter "$FILTER" run build
          else
            ${{ inputs.build-script }}
          fi

      - name: Pre-publish
        if: inputs.pre-publish-script != ''
        run: ${{ inputs.pre-publish-script }}

      - name: Publish
        run: |
          FILTER="${{ inputs.package-filter }}"
          DRY_RUN="${{ inputs.dry-run }}"
          FLAGS=""
          if [ "$DRY_RUN" = "true" ]; then
            FLAGS="--dry-run"
          fi

          if [ -n "$FILTER" ]; then
            pnpm --filter "$FILTER" publish --no-git-checks --access restricted $FLAGS
          else
            pnpm publish --no-git-checks --access restricted $FLAGS
          fi
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}

      - name: Summary
        run: |
          {
            echo "## Package Published"
            echo ""
            echo "- Registry: ${{ inputs.registry-url }}"
            echo "- Filter: ${{ inputs.package-filter || '(root)' }}"
            echo "- Dry run: ${{ inputs.dry-run }}"
          } >> "$GITHUB_STEP_SUMMARY"

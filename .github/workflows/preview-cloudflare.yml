name: Preview Cloudflare

on:
  workflow_call:
    inputs:
      node-version:
        description: "Node.js version"
        type: string
        default: "22"
      pnpm-version:
        description: "pnpm version"
        type: string
        default: "10"
      working-directory:
        description: "Working directory for wrangler"
        type: string
        default: "."
      build-script:
        description: "Build command before upload (empty to skip)"
        type: string
        default: ""
      wrangler-subcommand:
        description: "Wrangler subcommand producing a preview URL. Passed to wrangler-action, which supplies the `pnpm exec wrangler` prefix itself — so this is 'versions upload', not the full invocation used by deploy-cloudflare.yml."
        type: string
        default: "versions upload"
      comment-on-pr:
        description: "Post/update a PR comment with the preview URL"
        type: boolean
        default: true
      comment-marker:
        description: "Hidden HTML marker identifying the comment to update, so repeat runs edit rather than pile up"
        type: string
        default: "<!-- cf-preview-url -->"
      doppler-project:
        description: "Doppler project name (empty to skip Doppler)"
        type: string
        default: ""
      doppler-config:
        description: "Doppler config environment"
        type: string
        default: "preview"
      registry-url:
        description: "npm registry URL for authentication (e.g. https://npm.pkg.github.com for GitHub Packages)"
        type: string
        default: ""
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: true
      CLOUDFLARE_ACCOUNT_ID:
        required: false
      DOPPLER_TOKEN:
        required: false
    outputs:
      preview-url:
        description: "Versioned Cloudflare preview URL"
        value: ${{ jobs.preview.outputs.preview-url }}

# Unlike deploy, superseded previews are worth cancelling — only the latest
# commit on a PR is interesting.
concurrency:
  group: preview-cloudflare-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    # Fork PRs get no secrets and a read-only token, so the upload would fail
    # at the wrangler step and the comment step couldn't post. Skip cleanly.
    if: >-
      github.event_name != 'pull_request'
      || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ vars.RUNS_ON || 'ubuntu-latest' }}
    permissions:
      contents: read
      pull-requests: write
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    outputs:
      preview-url: ${{ steps.upload.outputs.deployment-url }}
    steps:
      - uses: actions/checkout@v7

      # Shared setup: setup-node -> packageManager-aware pnpm version
      # resolution -> pnpm/action-setup -> store cache -> GitHub Packages
      # lockfile guard. See .github/actions/setup-pnpm.
      - uses: unstable-studios/.github/.github/actions/setup-pnpm@main
        with:
          node-version: ${{ inputs.node-version }}
          pnpm-version: ${{ inputs.pnpm-version }}
          registry-url: ${{ inputs.registry-url || '' }}
          working-directory: ${{ inputs.working-directory }}

      # wrangler-action falls back to its own bundled wrangler when
      # node_modules is absent, and that copy can be too old to read
      # wrangler.jsonc.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Doppler
        if: inputs.doppler-project != ''
        uses: dopplerhq/cli-action@v4

      - name: Build
        if: inputs.build-script != ''
        run: |
          if [ -n "$DOPPLER_PROJECT" ]; then
            doppler run -p "$DOPPLER_PROJECT" -c "$DOPPLER_CONFIG" -- ${{ inputs.build-script }}
          else
            ${{ inputs.build-script }}
          fi
        env:
          DOPPLER_PROJECT: ${{ inputs.doppler-project }}
          DOPPLER_CONFIG: ${{ inputs.doppler-config }}
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}

      # Uploads a version without deploying it, so nothing on the live routes
      # changes. The versioned URL is a *.workers.dev host.
      - id: upload
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: ${{ inputs.working-directory }}
          packageManager: pnpm
          command: ${{ inputs.wrangler-subcommand }}

      - name: Comment preview URL on PR
        if: >-
          inputs.comment-on-pr
          && github.event_name == 'pull_request'
          && steps.upload.outputs.deployment-url != ''
        uses: actions/github-script@v7
        env:
          PREVIEW_URL: ${{ steps.upload.outputs.deployment-url }}
          COMMENT_MARKER: ${{ inputs.comment-marker }}
        with:
          script: |
            const marker = process.env.COMMENT_MARKER;
            const sha = context.payload.pull_request.head.sha.slice(0, 7);
            const body = `${marker}\n**Cloudflare preview:** ${process.env.PREVIEW_URL}\n\n_Updated for ${sha}._`;
            // Paginate: the marker comment can fall past the first page on a
            // long PR, and missing it would create a duplicate every push.
            const comments = await github.paginate(github.rest.issues.listComments, {
              ...context.repo, issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });
            }

name: Commitlint

on:
  workflow_call:
    inputs:
      node-version:
        description: "Node.js version"
        type: string
        default: "22"
      pnpm-version:
        description: "pnpm version"
        type: string
        default: "10"
      config-file:
        description: "Commitlint config file path (empty uses default)"
        type: string
        default: ""

jobs:
  commitlint:
    runs-on: ${{ vars.RUNS_ON || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # setup-node runs before pnpm/action-setup so the v6 self-installer runs
      # on the setup-node Node, not the runner default. cache: pnpm can't be
      # used in this order (pnpm isn't installed yet), so the store is cached
      # explicitly below.
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ inputs.node-version }}

      # pnpm/action-setup aborts with "Multiple versions of pnpm specified"
      # when both its `version` input and a package.json `packageManager` field
      # are set. Defer to `packageManager` when the caller uses it (the Corepack
      # convention) and fall back to the input otherwise. Checks the root
      # package.json because that is the file the action itself reads,
      # regardless of any working-directory default.
      - name: Resolve pnpm version
        id: pnpm-version
        run: |
          PKG="$GITHUB_WORKSPACE/package.json"
          if [ -f "$PKG" ] && grep -qE '"packageManager"[[:space:]]*:[[:space:]]*"pnpm@' "$PKG"; then
            echo "Using pnpm version from package.json packageManager"
            echo "version=" >> "$GITHUB_OUTPUT"
          else
            echo "version=$PNPM_VERSION" >> "$GITHUB_OUTPUT"
          fi
        env:
          PNPM_VERSION: ${{ inputs.pnpm-version }}

      - uses: pnpm/action-setup@v6
        with:
          version: ${{ steps.pnpm-version.outputs.version }}

      - name: Locate pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate commits (PR)
        if: github.event_name == 'pull_request'
        run: >-
          pnpm exec commitlint
          ${{ inputs.config-file != '' && format('--config {0}', inputs.config-file) || '' }}
          --from ${{ github.event.pull_request.base.sha }}
          --to ${{ github.event.pull_request.head.sha }}
          --verbose

      - name: Validate commits (push)
        if: github.event_name == 'push'
        run: >-
          pnpm exec commitlint
          ${{ inputs.config-file != '' && format('--config {0}', inputs.config-file) || '' }}
          --from ${{ github.event.before }}
          --to ${{ github.event.after }}
          --verbose

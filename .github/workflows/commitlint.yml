name: Commitlint

on:
  workflow_call:
    inputs:
      node-version:
        description: "Node.js version"
        type: string
        default: "22"
      pnpm-version:
        description: "pnpm version"
        type: string
        default: "10"
      config-file:
        description: "Commitlint config file path (empty uses default)"
        type: string
        default: ""

jobs:
  commitlint:
    runs-on: ${{ vars.RUNS_ON || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Shared setup: setup-node -> packageManager-aware pnpm version
      # resolution -> pnpm/action-setup -> store cache -> GitHub Packages
      # lockfile guard. See .github/actions/setup-pnpm.
      - uses: unstable-studios/.github/.github/actions/setup-pnpm@chore/setup-pnpm-composite-action
        with:
          node-version: ${{ inputs.node-version }}
          pnpm-version: ${{ inputs.pnpm-version }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate commits (PR)
        if: github.event_name == 'pull_request'
        run: >-
          pnpm exec commitlint
          ${{ inputs.config-file != '' && format('--config {0}', inputs.config-file) || '' }}
          --from ${{ github.event.pull_request.base.sha }}
          --to ${{ github.event.pull_request.head.sha }}
          --verbose

      - name: Validate commits (push)
        if: github.event_name == 'push'
        run: >-
          pnpm exec commitlint
          ${{ inputs.config-file != '' && format('--config {0}', inputs.config-file) || '' }}
          --from ${{ github.event.before }}
          --to ${{ github.event.after }}
          --verbose

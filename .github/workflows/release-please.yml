name: Release Please

on:
  workflow_call:
    inputs:
      config-file:
        description: "Path to release-please-config.json"
        type: string
        default: "release-please-config.json"
      manifest-file:
        description: "Path to .release-please-manifest.json"
        type: string
        default: ".release-please-manifest.json"
      mark-latest:
        description: >-
          Whether a new release takes GitHub's Latest mark when it is created. Turn it off when
          files are attached to the release afterwards, such as installers an updater looks
          for: the release that was Latest keeps the mark, and the caller marks the new one
          Latest once it is complete (`gh release edit <tag> --latest`).
        type: boolean
        default: true
    secrets:
      GH_PAT_RELEASEPLEASE:
        required: true
    outputs:
      releases_created:
        description: "Whether any releases were created"
        value: ${{ jobs.release-please.outputs.releases_created }}
      release_created:
        description: "Whether a single release was created (non-monorepo)"
        value: ${{ jobs.release-please.outputs.release_created }}
      tag_name:
        description: "Release tag name (non-monorepo)"
        value: ${{ jobs.release-please.outputs.tag_name }}
      version:
        description: "Release version (non-monorepo)"
        value: ${{ jobs.release-please.outputs.version }}
      pr:
        description: "Release PR number"
        value: ${{ jobs.release-please.outputs.pr }}
      paths_released:
        description: "JSON array of released paths (monorepo)"
        value: ${{ jobs.release-please.outputs.paths_released }}
      all:
        description: "Full JSON output from release-please"
        value: ${{ jobs.release-please.outputs.all }}

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ${{ vars.RUNS_ON || 'ubuntu-latest' }}
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
      pr: ${{ steps.release.outputs.pr }}
      paths_released: ${{ steps.release.outputs.paths_released }}
      all: ${{ toJSON(steps.release.outputs) }}
    steps:
      # Release Please has no setting for the Latest mark: GitHub gives it to every release
      # it creates. With `mark-latest` off, note which release has the mark now, and put it
      # back as soon as a new release exists.
      - name: Note the Latest release
        id: latest
        if: ${{ !inputs.mark-latest }}
        env:
          GH_TOKEN: ${{ secrets.GH_PAT_RELEASEPLEASE }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          if answer=$(gh api "repos/$REPO/releases/latest" --jq .tag_name 2>&1); then
            echo "tag=$answer" >> "$GITHUB_OUTPUT"
            echo "Latest is $answer."
          elif grep -q "HTTP 404" <<<"$answer"; then
            # A repository with no release yet has no Latest one.
            echo "No Latest release yet."
          else
            # Not worth stopping a release for: the new release keeps the mark this once.
            echo "::warning::Could not read the Latest release, so the mark will not be held: $answer"
          fi

      - uses: googleapis/release-please-action@v5
        id: release
        with:
          config-file: ${{ inputs.config-file }}
          manifest-file: ${{ inputs.manifest-file }}
          token: ${{ secrets.GH_PAT_RELEASEPLEASE }}

      - name: Keep the Latest mark where it was
        if: ${{ !inputs.mark-latest && steps.release.outputs.releases_created == 'true' && steps.latest.outputs.tag != '' }}
        # The release exists by now. Failing here would hide that from callers that read the
        # outputs, so a failure only shows as a warning on the run.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GH_PAT_RELEASEPLEASE }}
          REPO: ${{ github.repository }}
          PREVIOUS: ${{ steps.latest.outputs.tag }}
        run: |
          echo "Keeping $PREVIOUS as Latest. The caller marks the new release when it is complete."
          gh release edit "$PREVIOUS" --repo "$REPO" --latest

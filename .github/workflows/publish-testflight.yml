name: Publish TestFlight

# Archive an iOS app, sign it for distribution and upload it to App Store
# Connect, where it shows under TestFlight.
#
# The archive is built unsigned (CODE_SIGNING_ALLOWED=NO), so it needs no
# development certificate and no key. Xcode embeds entitlements only when it
# signs, so the job then signs the app and its extensions ad hoc with their
# entitlements files and checks the App Groups are on them. Signing for
# distribution happens in xcodebuild -exportArchive with
# -allowProvisioningUpdates, using the export options' automatic signing,
# which must carry the teamID (the archive records no team). The export runs
# twice from the same archive: first to a folder, where the job reads the
# signed binaries' entitlements and fails if an App Group is missing, then
# with the options' upload, so nothing unchecked reaches App Store Connect.
# Signing is automatic with certificates Apple keeps (cloud signing), so
# the runner holds no distribution certificate. xcodebuild signs in with an
# App Store Connect team API key whose role is Admin, written to disk only
# after the archive, for the export. The key comes from the
# calling repo's testflight environment, where Doppler syncs it:
#
#   vars.ASC_KEY_ID          The key's ID
#   vars.ASC_ISSUER_ID       The issuer ID of the team's keys
#   secrets.ASC_KEY_P8       The contents of the key's .p8 file
#
# The caller must pass the secret by name (ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}),
# even though it only exists in the environment.
#
# The Mac is the one the org variable RUNS_ON_MACOS_PUBLISH names, and
# GitHub's xcode-27 runner when it isn't set. It is never the CI pool
# (RUNS_ON_MACOS): those runners keep their accounts between jobs and run
# every pull request's build, so a dependency in any of them could leave a
# process behind that reads the key during a later upload. The job fails
# early on a CI pool runner (named echo-macaroni-<n>).
#
# A publish runner is one only publish jobs use, one runner per account,
# outside the CI pool: the keychain list and provisioning profiles are per
# account, so two runners sharing one would undo each other's. What keeps
# other workflows off it is the org runner group testflight-publish
# (selected repos tabstash-apple and rabbithole-apple, workflows limited to
# unstable-studios/.github/.github/workflows/publish-testflight.yml@refs/heads/main),
# not its label. The calling repo's own code on the allowed branch still
# runs there during the archive (build phases, package plugins); the key
# isn't on disk when the archive runs, but a process that code started can
# outlive that step.
#
# The environment is always testflight, written into the job rather than
# taken as an input. The runner group limits the workflow and the repos, not
# the branch a caller runs on, so the environment's branch rule (main only)
# is what keeps workflows on other branches off the publish runner. If a
# caller could name another environment, a workflow on any branch could run
# this job there: no key, but on the publish runner, where it could change
# the account's files before the next real upload.
#
# Create the testflight environment with its main branch rule before adding
# a repo to the testflight-publish runner group; GitHub creates a missing
# environment on first use with no protection rules.
#
# A self-hosted runner keeps its home folder between jobs, so there the job
# signs with a keychain of its own in $RUNNER_TEMP and its last step
# deletes it, restores the account's keychain list and default, and
# removes any provisioning profile it downloaded. It also removes anything
# new in ~/Library/Keychains: the first xcodebuild call can make macOS
# create the account's data protection keychain there (a folder named
# with the Mac's hardware UUID), which the search list doesn't cover and
# which may hold an Apple Development key. secd, the account's keychain
# daemon, keeps that database open between jobs and can start again
# between them, so the job stops it at the start, removes any data
# protection keychain an earlier job left, and stops it again around the
# final removal. Cleanup also deletes Xcode's URL caches and HTTP stores
# (com.apple.dt.xcodebuild, com.apple.dt.Xcode.ITunesSoftwareService and
# com.apple.itunes.swinfo under ~/Library/Caches and ~/Library/HTTPStorages,
# and ~/Library/Application Support/com.apple.dt.Xcode.ITunesSoftwareService):
# a URL cache keeps request headers, which can include the App Store
# Connect token made from the key. What stays: SwiftPM's caches
# (~/Library/Caches/org.swift.swiftpm, ~/Library/org.swift.swiftpm and
# ~/.swiftpm, which links to them), which hold clones of the app's
# package dependencies, their fingerprints and parsed manifests but no
# credentials, and Xcode's preferences. The job also leaves
# ~/Library/Developer/CoreSimulator, ~/Library/Developer/DVTDownloads,
# ~/Library/Caches/com.apple.cds*, ~/Library/Logs/CoreSimulator and
# ~/Library/Containers/com.apple.CoreDevice.*, none of which holds
# credentials. On GitHub's runners signing uses the login keychain, as
# before. On both, the build goes to $RUNNER_TEMP and the key and build
# are deleted at the end.
#
# Signing with -allowProvisioningUpdates on a self-hosted runner can make an
# Apple Development certificate ("Created via API") whose private key is in
# the job keychain. Archiving unsigned is meant to stop that, so the job
# should make none. If it still does (the export asks for one), the key is
# useless once deleted, and while the certificate exists the next run fails
# ("Your account already has an Apple Development signing certificate for
# this machine"). So the job lists the account's DEVELOPMENT certificates
# before the export, and before the key and the keychain are deleted, and
# also when an earlier step failed, it revokes each certificate whose
# private key is in the job keychain, as a fallback: it reads their serial
# numbers and deletes the account's certificate with each serial. No other
# certificate on the account is touched. A certificate that is new since the
# first list and wasn't revoked fails the job with its id. A failed
# revocation fails the job and leaves the rest of cleanup to run.

on:
  workflow_call:
    inputs:
      project:
        description: "Path to the .xcodeproj"
        type: string
        required: true
      scheme:
        description: "Scheme to archive"
        type: string
        required: true
      ref:
        description: "Commit, tag or branch to build. Empty builds the commit the caller ran for. Pass release-please's sha so the build is the tagged commit."
        type: string
        default: ""
      version:
        description: "Version people see, such as 1.2.3. Empty reads the root package's version from the release-please manifest."
        type: string
        default: ""
      manifest-file:
        description: "Path to .release-please-manifest.json, read when version is empty"
        type: string
        default: ".release-please-manifest.json"
      build-number:
        description: "Build number, higher than any uploaded for this version. Empty uses the time in UTC, as YYYYMMDDHHMM."
        type: string
        default: ""
      export-options:
        description: "Path to the export options plist (method app-store-connect, destination upload, and teamID: the unsigned archive records no team, so the export takes it from here)"
        type: string
        default: "Config/TestFlight-ExportOptions.plist"
      runs-on:
        description: "Runner label. It must have the Xcode at xcode-path. Empty uses vars.RUNS_ON_MACOS_PUBLISH, or GitHub's xcode-27 when that isn't set. Never a runner that also runs CI."
        type: string
        default: ""
      xcode-path:
        description: "Path to the Xcode app to build with"
        type: string
        default: "/Applications/Xcode_27.2.app"
      timeout-minutes:
        description: "Job timeout"
        type: number
        default: 45
    secrets:
      ASC_KEY_P8:
        description: "Contents of the App Store Connect API key's .p8 file"
        required: true
    outputs:
      version:
        description: "The version that was uploaded"
        value: ${{ jobs.upload.outputs.version }}
      build-number:
        description: "The build number that was uploaded"
        value: ${{ jobs.upload.outputs.build-number }}

# Scoped to the calling repo: one upload per repo at a time. Uploads from
# different repos can run at once if the publish runners allow it.
concurrency:
  group: publish-testflight
  cancel-in-progress: false

jobs:
  upload:
    name: Upload to TestFlight
    # In the job, not as the input's default, so passing runs-on still wins.
    # vars are the calling repo's. Not RUNS_ON_MACOS: see the top of the file.
    runs-on: ${{ inputs.runs-on || vars.RUNS_ON_MACOS_PUBLISH || 'xcode-27' }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    # Holds the key. Its rules decide which branches and tags may use it,
    # and so which may run on the publish runner. Fixed: see the top of the
    # file.
    environment: testflight
    permissions:
      contents: read
    outputs:
      version: ${{ steps.plan.outputs.version }}
      build-number: ${{ steps.plan.outputs.build }}
    env:
      DEVELOPER_DIR: ${{ inputs.xcode-path }}/Contents/Developer
    steps:
      - name: Refuse a CI pool runner
        if: runner.environment == 'self-hosted'
        env:
          NAME: ${{ runner.name }}
        run: |
          if [[ $NAME =~ ^echo-macaroni-[0-9]+$ ]]; then
            echo "::error::$NAME is in the CI pool, which runs pull requests' code. Publish from a runner only publish jobs use (RUNS_ON_MACOS_PUBLISH)."
            exit 1
          fi

      # Self-hosted only, and before anything runs Xcode's tools: the
      # first xcodebuild call can make macOS create the account's data
      # protection keychain, ~/Library/Keychains/<hardware UUID>, which
      # the keychain search list doesn't cover. Cleanup removes whatever
      # is new in that folder.
      - name: Record the account's keychain folder
        if: runner.environment == 'self-hosted'
        shell: bash
        run: |
          state="$RUNNER_TEMP/signing"
          mkdir -p "$state"
          # Waits for the secd processes running now to exit, not for no
          # secd at all: launchd may start a new one at any time.
          stop_secd() {
            local pids=() pid alive
            while IFS= read -r pid; do pids+=("$pid"); done < <(pgrep -U "$(id -u)" -x secd)
            if [ "${#pids[@]}" -eq 0 ]; then return 0; fi
            kill -TERM "${pids[@]}"
            for _ in $(seq 1 20); do
              alive=0
              for pid in "${pids[@]}"; do
                if kill -0 "$pid" 2>/dev/null; then alive=1; fi
              done
              if [ "$alive" -eq 0 ]; then return 0; fi
              sleep 0.5
            done
            kill -KILL "${pids[@]}" 2>/dev/null
            sleep 1
            for pid in "${pids[@]}"; do
              if kill -0 "$pid" 2>/dev/null; then return 1; fi
            done
          }
          # secd, the account's keychain daemon, keeps running between
          # jobs, and its scheduled tasks can start it again after cleanup
          # stopped it, recreating the data protection keychain. Stop it,
          # and wait for it to exit, before removing that keychain:
          # unlinking an open SQLite database can corrupt it
          # (https://www.sqlite.org/howtocorrupt.html). launchd starts it
          # again when something next asks for it.
          stop_secd || { echo "::error::secd didn't stop."; exit 1; }
          keychains_dir="$HOME/Library/Keychains"
          for entry in "$keychains_dir"/*-*-*-*-*; do
            if [ -d "$entry" ]; then
              echo "Removing $entry, left from an earlier job"
              rm -rf "$entry" || { echo "::error::Couldn't remove $entry."; exit 1; }
            fi
          done
          if [ -d "$keychains_dir" ]; then
            # Not the <UUID> folders: one recreated since the removal above
            # isn't the account's own, and cleanup must not keep it. Files
            # with that shape of name stay, as the removal leaves them.
            find "$keychains_dir" -mindepth 1 -maxdepth 1 ! \( -type d -name '*-*-*-*-*' \) -exec basename {} \; > "$state/keychain-files.new"
          else
            : > "$state/keychain-files.new"
            # Cleanup removes the folder the job creates.
            touch "$state/no-keychains-dir"
          fi
          # Last: cleanup removes entries only when this file exists.
          mv "$state/keychain-files.new" "$state/keychain-files"

      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Work out the version and build number
        id: plan
        env:
          VERSION: ${{ inputs.version }}
          BUILD: ${{ inputs.build-number }}
          MANIFEST_FILE: ${{ inputs.manifest-file }}
        run: |
          if [ -z "$VERSION" ]; then
            if [ ! -f "$MANIFEST_FILE" ]; then
              echo "::error::No version was given and there is no manifest at $MANIFEST_FILE."
              exit 2
            fi
            VERSION=$(/usr/bin/python3 -c 'import json, sys; print(json.load(open(sys.argv[1])).get(".", ""))' "$MANIFEST_FILE")
          fi
          # The time, to the minute. It only ever rises, whichever workflow
          # calls this and however often it is re-run or renamed, so no two
          # uploads of a version share a build number.
          if [ -z "$BUILD" ]; then
            BUILD=$(date -u +%Y%m%d%H%M)
          fi
          number='(0|[1-9][0-9]*)'
          if ! [[ $VERSION =~ ^$number\.$number\.$number$ ]]; then
            echo "::error::The version must look like 1.2.3, not '$VERSION'."
            exit 2
          fi
          if ! [[ $BUILD =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::The build number must be a whole number above zero, not '$BUILD'."
            exit 2
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"

      # Before the key is written: the unsigned archive records no team, so
      # the export signs with the teamID in the export options.
      - name: Check the export options
        env:
          EXPORT_OPTIONS: ${{ inputs.export-options }}
        run: |
          if [ ! -f "$EXPORT_OPTIONS" ]; then
            echo "::error::There is no export options plist at $EXPORT_OPTIONS."
            exit 2
          fi
          team=$(/usr/libexec/PlistBuddy -c 'Print :teamID' "$EXPORT_OPTIONS" 2>/dev/null || true)
          if [ -z "$team" ]; then
            echo "::error::$EXPORT_OPTIONS has no teamID. The archive is unsigned, so the export needs the team there (add <key>teamID</key><string>YOUR_TEAM_ID</string>)."
            exit 2
          fi

      # Self-hosted only: a keychain for this job, and the only one
      # xcodebuild sees, so anything signing creates (an Apple Development
      # key, for one) goes there and is deleted with it. The account's own
      # list is restored at the end.
      - name: Create a keychain for this job
        if: runner.environment == 'self-hosted'
        shell: bash
        run: |
          state="$RUNNER_TEMP/signing"
          mkdir -p "$state"
          # The account's list and default, without any job keychain an
          # earlier job failed to remove, and only keychains that exist.
          unquote() { sed -e 's/^ *"//' -e 's/"$//'; }
          keep() {
            while IFS= read -r keychain; do
              case "$keychain" in
                ""|*/_temp/*|*/signing.keychain-db) ;;
                *) if [ -e "$keychain" ]; then echo "$keychain"; fi ;;
              esac
            done
          }
          # Each file is moved into place only once it is complete, so
          # cleanup never restores a list a failed command left empty.
          security list-keychains -d user | unquote | keep > "$state/keychains.new"
          { security default-keychain -d user 2>/dev/null || true; } | unquote | keep > "$state/default-keychain.new"
          for dir in "$HOME/Library/MobileDevice/Provisioning Profiles" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
            for profile in "$dir"/*; do
              if [ -e "$profile" ]; then basename "$profile"; fi
            done
          done > "$state/profiles.new"
          mv "$state/default-keychain.new" "$state/default-keychain"
          mv "$state/profiles.new" "$state/profiles"
          # Last: cleanup restores only when this file exists.
          mv "$state/keychains.new" "$state/keychains"

          keychain="$RUNNER_TEMP/signing.keychain-db"
          # Never written down: the keychain is deleted at the end of the job.
          password=$(openssl rand -hex 32)
          security create-keychain -p "$password" "$keychain"
          # No auto-lock: a long archive mustn't find it locked.
          security set-keychain-settings "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security list-keychains -d user -s "$keychain"
          security default-keychain -d user -s "$keychain"
          security list-keychains -d user

      # Archive first, with no key on disk: the archive is unsigned, so
      # build phases and package plugins of the caller's code that run during
      # it have nothing to read. The key is written only for the export.
      - name: Archive unsigned
        id: archive
        env:
          PROJECT: ${{ inputs.project }}
          SCHEME: ${{ inputs.scheme }}
          VERSION: ${{ steps.plan.outputs.version }}
          BUILD: ${{ steps.plan.outputs.build }}
          # Distribution logs and export staging, which would otherwise
          # stay in the account's temporary folder.
          TMPDIR: ${{ runner.temp }}/tmp
        run: |
          mkdir -p "$TMPDIR"
          archive="$RUNNER_TEMP/app.xcarchive"
          # Not ~/Library/Developer/Xcode/DerivedData, which outlives the job
          # on the pool.
          derived="$RUNNER_TEMP/DerivedData"

          # The app and its extensions must carry the same version and
          # build, so both are set for every target here. Unsigned: signing
          # happens at export, with the distribution certificate Apple keeps.
          # Xcode embeds entitlements only when it signs, so the next step
          # puts them back.
          xcodebuild archive \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$archive" \
            -derivedDataPath "$derived" \
            MARKETING_VERSION="$VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD" \
            CODE_SIGNING_ALLOWED=NO

      # An unsigned archive carries no entitlements, and the export signs
      # with the ones it finds on the archived binaries, so an App Group would
      # be dropped without a word and TestFlight processing wouldn't notice.
      # So this signs everything nested in the app ad hoc (no certificate, no
      # keychain), children first: frameworks and dylibs, each extension, then
      # the app. codesign needs nested code signed before its container, so
      # every bundle is signed, with its target's entitlements file where it
      # has one. Targets
      # come from the project's build settings for every target (the scheme's
      # lists only the app target, not its embedded extensions), in the
      # archive's configuration, matched to the archived bundles
      # by bundle identifier; $(VAR) references in the entitlements file are
      # expanded from that target's settings. It then reads the entitlements
      # back and fails if an application-groups value is missing, or if the
      # app's own target resolves no entitlements file.
      - name: Put the entitlements on the archive
        env:
          PROJECT: ${{ inputs.project }}
        shell: bash
        run: |
          /usr/bin/python3 - <<'PY'
          import glob, json, os, plistlib, re, subprocess, sys

          temp = os.environ["RUNNER_TEMP"]
          archive = os.path.join(temp, "app.xcarchive")

          def fail(message):
              print(f"::error::{message}")
              sys.exit(1)

          # Builds nothing. No -derivedDataPath: xcodebuild rejects it with
          # -alltargets (usage error 64) unless a scheme is given. Without
          # it, though, the call writes a <Project>-<hash> folder under the
          # account's ~/Library/Developer/Xcode/DerivedData, which outlives
          # the job on a self-hosted runner. So the default location is
          # moved into the job's build folder with the user default
          # -IDECustomDerivedDataLocation, and the package clones the archive
          # made are reused (no new fetch).
          derived = os.path.join(temp, "DerivedData")
          result = subprocess.run(
              ["xcodebuild", "-showBuildSettings", "-json",
               "-project", os.environ["PROJECT"], "-alltargets",
               "-configuration", "Release", "-sdk", "iphoneos",
               "-clonedSourcePackagesDirPath", os.path.join(derived, "SourcePackages"),
               f"-IDECustomDerivedDataLocation={derived}"],
              capture_output=True, text=True)
          if result.returncode != 0:
              print("xcodebuild stdout:\n" + result.stdout, file=sys.stderr)
              print("xcodebuild stderr:\n" + result.stderr, file=sys.stderr)
              fail(f"xcodebuild -showBuildSettings failed with status {result.returncode}.")
          shown = result.stdout
          if "[" not in shown:
              print("xcodebuild stdout:\n" + shown, file=sys.stderr)
              fail("xcodebuild -showBuildSettings printed no JSON.")
          try:
              targets = json.loads(shown[shown.index("["):])
          except ValueError:
              print("xcodebuild stdout:\n" + shown, file=sys.stderr)
              fail("xcodebuild -showBuildSettings printed JSON that doesn't parse.")
          settings_by_id = {}
          for target in targets:
              settings = target["buildSettings"]
              settings_by_id.setdefault(settings.get("PRODUCT_BUNDLE_IDENTIFIER", ""), settings)

          def expand(value, settings):
              if isinstance(value, str):
                  for _ in range(10):
                      new = re.sub(r"\$[({]([A-Za-z_][A-Za-z0-9_]*)[)}]",
                                   lambda m: settings.get(m.group(1), m.group(0)), value)
                      if new == value:
                          break
                      value = new
                  if "$(" in value or "${" in value:
                      fail(f"Can't expand {value!r} from the target's build settings.")
                  return value
              if isinstance(value, list):
                  return [expand(v, settings) for v in value]
              if isinstance(value, dict):
                  return {k: expand(v, settings) for k, v in value.items()}
              return value

          apps = glob.glob(os.path.join(archive, "Products", "Applications", "*.app"))
          if len(apps) != 1:
              fail(f"Expected one app in the archive, found {len(apps)}.")
          app = apps[0]
          appexes = sorted(glob.glob(os.path.join(app, "PlugIns", "*.appex")))
          bundles = appexes + [app]

          def nested_code(container):
              return sorted(glob.glob(os.path.join(container, "Frameworks", "*.framework"))
                            + glob.glob(os.path.join(container, "Frameworks", "*.dylib")))

          def adhoc(path, entitlements=None):
              command = ["codesign", "--force", "--sign", "-"]
              if entitlements:
                  command += ["--entitlements", entitlements]
              subprocess.run(command + [path], check=True)

          os.makedirs(os.path.join(temp, "entitlements"), exist_ok=True)
          expected = {}
          # Nested code first, so each container is signed over signed parts.
          for container in [app] + appexes:
              for code in nested_code(container):
                  adhoc(code)
          for bundle in bundles:
              with open(os.path.join(bundle, "Info.plist"), "rb") as f:
                  bundle_id = plistlib.load(f)["CFBundleIdentifier"]
              settings = settings_by_id.get(bundle_id)
              if settings is None:
                  fail(f"No target in {os.environ['PROJECT']} has bundle identifier {bundle_id} ({os.path.basename(bundle)}).")
              source = settings.get("CODE_SIGN_ENTITLEMENTS", "")
              if not source:
                  if bundle == app:
                      fail(f"The app target ({bundle_id}) resolves no CODE_SIGN_ENTITLEMENTS for the iphoneos SDK, so its entitlements can't be put back.")
                  print(f"{bundle_id}: no entitlements file; signed ad hoc without.")
                  adhoc(bundle)
                  continue
              with open(os.path.join(settings["SRCROOT"], source), "rb") as f:
                  entitlements = expand(plistlib.load(f), settings)
              resolved = os.path.join(temp, "entitlements", bundle_id + ".plist")
              with open(resolved, "wb") as f:
                  plistlib.dump(entitlements, f)
              adhoc(bundle, resolved)
              groups = entitlements.get("com.apple.security.application-groups")
              if groups:
                  expected[bundle_id] = groups
              print(f"{bundle_id}: signed ad hoc with {source}; application-groups {groups}.")
          # Read back what is on the archived binaries.
          for bundle in bundles:
              with open(os.path.join(bundle, "Info.plist"), "rb") as f:
                  bundle_id = plistlib.load(f)["CFBundleIdentifier"]
              if bundle_id not in expected:
                  continue
              out = subprocess.run(["codesign", "-d", "--entitlements", ":-", bundle],
                                   check=True, capture_output=True).stdout
              found = plistlib.loads(out).get("com.apple.security.application-groups", [])
              missing = [g for g in expected[bundle_id] if g not in found]
              if missing:
                  fail(f"{bundle_id} lost application-groups {missing} after signing.")
          with open(os.path.join(temp, "expected-groups.json"), "w") as f:
              json.dump(expected, f)
          PY

      # Only now: the archive and the entitlements step run with no key on
      # disk.
      - name: Write the App Store Connect key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          # Empty when it is missing from the environment, was synced as a
          # variable, or the caller didn't pass it.
          : "${ASC_KEY_P8:?ASC_KEY_P8 is not a secret in this environment, or the caller did not pass it.}"
          umask 077
          printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/asc-key.p8"
          if ! grep -q "PRIVATE KEY" "$RUNNER_TEMP/asc-key.p8"; then
            echo "::error::ASC_KEY_P8 isn't an API key (.p8)."
            exit 2
          fi

      # Shared by the steps that call the App Store Connect API: the token,
      # an ES256 JWT that expires in 10 minutes
      # (https://developer.apple.com/documentation/appstoreconnectapi/generating-tokens-for-api-requests).
      # openssl signs in DER, SEQUENCE { INTEGER r, INTEGER s }; a JWS
      # ES256 signature is r and s as 32 bytes each, big-endian
      # (RFC 7518, 3.4). The token goes only to Apple's API, is masked and is
      # never printed.
      - name: Write the App Store Connect API helper
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/asc-api.sh" <<'HELPER'
          # Sourced. Needs ASC_KEY_ID and ASC_ISSUER_ID, and the key at $RUNNER_TEMP/asc-key.p8.
          asc_api_base="https://api.appstoreconnect.apple.com/v1"
          asc_b64url() { /usr/bin/openssl base64 -A | tr '+/' '-_' | tr -d '='; }
          # asc_auth <file>: writes an Authorization header file with a fresh token.
          asc_auth() {
            local out=$1 key="$RUNNER_TEMP/asc-key.p8" now header payload raw int jwt dir
            [ -n "${ASC_KEY_ID:-}" ] && [ -n "${ASC_ISSUER_ID:-}" ] || { echo "::error::ASC_KEY_ID or ASC_ISSUER_ID is not a variable in this environment."; return 1; }
            [ -s "$key" ] || { echo "::error::The App Store Connect key isn't at $key."; return 1; }
            dir=$(mktemp -d "$RUNNER_TEMP/jwt.XXXXXX") || return 1
            now=$(date +%s)
            header=$(/usr/bin/jq -cjn --arg kid "$ASC_KEY_ID" '{alg: "ES256", kid: $kid, typ: "JWT"}' | asc_b64url)
            payload=$(/usr/bin/jq -cjn --arg iss "$ASC_ISSUER_ID" --argjson iat "$now" --argjson exp "$((now + 600))" \
              '{iss: $iss, iat: $iat, exp: $exp, aud: "appstoreconnect-v1"}' | asc_b64url)
            printf '%s' "$header.$payload" | /usr/bin/openssl dgst -sha256 -sign "$key" -out "$dir/sig.der" \
              && /usr/bin/openssl asn1parse -inform DER -in "$dir/sig.der" > "$dir/sig.txt" \
              || { rm -rf "$dir"; echo "::error::Couldn't sign the App Store Connect token."; return 1; }
            raw=""
            while IFS= read -r int; do
              int=$(printf '%s' "$int" | sed 's/^0*//')
              [[ $int =~ ^[0-9A-Fa-f]{0,64}$ ]] || { rm -rf "$dir"; echo "::error::The token's signature isn't an ES256 signature."; return 1; }
              raw+=$(printf '%64s' "$int" | tr ' ' 0)
            done < <(awk -F: '/prim: *INTEGER/ { print $NF }' "$dir/sig.txt")
            rm -rf "$dir"
            [ "${#raw}" -eq 128 ] || { echo "::error::The token's signature isn't an ES256 signature."; return 1; }
            jwt="$header.$payload.$(printf '%s' "$raw" | /usr/bin/xxd -r -p | asc_b64url)"
            echo "::add-mask::$jwt"
            # In a file, not on curl's command line, where ps would show it.
            ( umask 077; printf 'Authorization: Bearer %s\n' "$jwt" > "$out" )
          }
          # asc_api <method> <url> <header file> <response file>: prints the HTTP status.
          asc_api() {
            /usr/bin/curl -sS --retry 3 --max-time 60 -o "$4" -w '%{http_code}' -X "$1" -H @"$3" "$2"
          }
          # asc_dev_certs <out> <work dir>: the account's DEVELOPMENT certificates, one "id<TAB>serial<TAB>name<TAB>expiration" per line.
          # Compared by serial by the caller: filter[serialNumber] doesn't say which format it
          # matches (https://developer.apple.com/documentation/appstoreconnectapi/get-v1-certificates).
          asc_dev_certs() {
            local out=$1 work=$2 url status
            : > "$out"
            asc_auth "$work/auth" || return 1
            url="$asc_api_base/certificates?filter%5BcertificateType%5D=DEVELOPMENT&fields%5Bcertificates%5D=serialNumber,name,expirationDate&limit=200"
            while [ -n "$url" ]; do
              # The token goes only to Apple's API.
              [[ $url == "$asc_api_base/"* ]] || { echo "::error::The certificate list links to $url, outside the App Store Connect API."; return 1; }
              status=$(asc_api GET "$url" "$work/auth" "$work/response") || { echo "::error::Couldn't list the account's certificates."; return 1; }
              [ "$status" = 200 ] || { echo "::error::Listing the account's certificates returned HTTP $status."; return 1; }
              /usr/bin/jq -r '.data[] | [.id, .attributes.serialNumber, .attributes.name, .attributes.expirationDate] | @tsv' "$work/response" >> "$out" || return 1
              url=$(/usr/bin/jq -r '.links.next // empty' "$work/response")
            done
          }
          HELPER

      # The account's Apple Development certificates before the export, to
      # compare with after. The revoke step reads this: a new one means the
      # export made it.
      - name: Record the account's development certificates
        if: runner.environment == 'self-hosted'
        shell: bash
        env:
          ASC_KEY_ID: ${{ vars.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ vars.ASC_ISSUER_ID }}
        run: |
          umask 077
          # shellcheck disable=SC1091
          source "$RUNNER_TEMP/asc-api.sh"
          dir="$RUNNER_TEMP/certs"
          mkdir -p "$dir"
          work=$(mktemp -d "$RUNNER_TEMP/certs.XXXXXX")
          trap 'rm -rf "$work"' EXIT
          asc_dev_certs "$work/before" "$work" || exit 1
          # Last: the revoke step compares only when this file exists.
          cut -f1 "$work/before" | sort > "$dir/before-ids.new"
          mv "$dir/before-ids.new" "$dir/before-ids"
          echo "$(wc -l < "$dir/before-ids" | tr -d ' ') Apple Development certificates on the account before the export."

      # Signs, so the key is needed. Exported twice from the same archive:
      # first to a folder, to read the signed binaries' entitlements before
      # anything reaches App Store Connect, then with the caller's options
      # ("upload" in them sends it).
      - name: Export, check the entitlements and upload
        id: export
        env:
          ASC_KEY_ID: ${{ vars.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ vars.ASC_ISSUER_ID }}
          SCHEME: ${{ inputs.scheme }}
          EXPORT_OPTIONS: ${{ inputs.export-options }}
          VERSION: ${{ steps.plan.outputs.version }}
          BUILD: ${{ steps.plan.outputs.build }}
          TMPDIR: ${{ runner.temp }}/tmp
        run: |
          mkdir -p "$TMPDIR"
          : "${ASC_KEY_ID:?ASC_KEY_ID is not a variable in this environment.}"
          : "${ASC_ISSUER_ID:?ASC_ISSUER_ID is not a variable in this environment.}"
          sign_in=(
            -allowProvisioningUpdates
            -authenticationKeyPath "$RUNNER_TEMP/asc-key.p8"
            -authenticationKeyID "$ASC_KEY_ID"
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          )
          archive="$RUNNER_TEMP/app.xcarchive"

          # The caller's options with destination export: the signed .ipa
          # lands in a folder here and goes nowhere.
          local_options="$RUNNER_TEMP/export-options-local.plist"
          cp "$EXPORT_OPTIONS" "$local_options"
          /usr/libexec/PlistBuddy -c "Set :destination export" "$local_options" 2>/dev/null \
            || /usr/libexec/PlistBuddy -c "Add :destination string export" "$local_options"
          xcodebuild -exportArchive \
            -archivePath "$archive" \
            -exportOptionsPlist "$local_options" \
            -exportPath "$RUNNER_TEMP/export-check" \
            "${sign_in[@]}"

          # Read the entitlements of the signed binaries in the .ipa.
          shopt -s nullglob
          ipas=("$RUNNER_TEMP"/export-check/*.ipa)
          if [ "${#ipas[@]}" -ne 1 ]; then
            echo "::error::Expected one .ipa in the export, found ${#ipas[@]}."
            exit 1
          fi
          unpacked="$RUNNER_TEMP/export-check/unpacked"
          ditto -x -k "${ipas[0]}" "$unpacked"
          IPA_APP=$(echo "$unpacked"/Payload/*.app) /usr/bin/python3 - <<'PY'
          import glob, json, os, plistlib, subprocess, sys

          expected = json.load(open(os.path.join(os.environ["RUNNER_TEMP"], "expected-groups.json")))
          app = os.environ["IPA_APP"]
          problems = []
          for bundle in sorted(glob.glob(os.path.join(app, "PlugIns", "*.appex"))) + [app]:
              with open(os.path.join(bundle, "Info.plist"), "rb") as f:
                  bundle_id = plistlib.load(f)["CFBundleIdentifier"]
              if bundle_id not in expected:
                  continue
              out = subprocess.run(["codesign", "-d", "--entitlements", ":-", bundle],
                                   capture_output=True).stdout
              try:
                  found = plistlib.loads(out).get("com.apple.security.application-groups", [])
              except Exception:
                  found = []
              for group in expected[bundle_id]:
                  if group not in found:
                      problems.append(f"{bundle_id} has no application group {group} in the exported build.")
              print(f"{bundle_id}: exported application-groups {found}.")
          seen = set()
          for bundle in glob.glob(os.path.join(app, "PlugIns", "*.appex")) + [app]:
              with open(os.path.join(bundle, "Info.plist"), "rb") as f:
                  seen.add(plistlib.load(f)["CFBundleIdentifier"])
          for bundle_id in expected:
              if bundle_id not in seen:
                  problems.append(f"{bundle_id} isn't in the exported build.")
          for problem in problems:
              print(f"::error::{problem}")
          sys.exit(1 if problems else 0)
          PY

          # The same archive and options, with "upload": signs again and
          # sends it to App Store Connect.
          xcodebuild -exportArchive \
            -archivePath "$archive" \
            -exportOptionsPlist "$EXPORT_OPTIONS" \
            -exportPath "$RUNNER_TEMP/export" \
            "${sign_in[@]}"

          echo "Uploaded $SCHEME $VERSION ($BUILD) to App Store Connect." >> "$GITHUB_STEP_SUMMARY"

      # Self-hosted only, after the upload whether or not it worked, and
      # before the key and the keychain are deleted. The archive is unsigned,
      # so the job should make no development certificate. But signing with
      # -allowProvisioningUpdates can make an Apple Development certificate
      # ("Created via API") for this Mac, with its private key in the job
      # keychain, if the export asks for one. Cleanup deletes that key, and
      # while the certificate exists the next run fails ("Your account
      # already has an Apple Development signing certificate for this
      # machine, but its private key is not installed in your keychain"). So
      # this revokes each certificate whose private key is in the job
      # keychain, found on the account by serial number. The keychain is new
      # each job, so every key in it is the job's; certificates without their
      # key there (the account's others) are never touched.
      #
      # It also compares the account's development certificates with the
      # list taken before the export. One that is new and wasn't revoked
      # (its key went elsewhere, the data protection keychain, say) fails the
      # job with its id, since it would be left behind; it is not revoked
      # here, because nothing shows it is the job's. With no certificate
      # made, the step succeeds. A failure fails the job; the steps after it
      # still run.
      - name: Revoke the job's Apple Development certificate
        if: always() && runner.environment == 'self-hosted'
        timeout-minutes: 5
        shell: bash
        env:
          ASC_KEY_ID: ${{ vars.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ vars.ASC_ISSUER_ID }}
        run: |
          trap 'echo "::error::Revoking the job'"'"'s Apple Development certificate stopped at line $LINENO. Revoke it in Certificates, Identifiers & Profiles, or the next run fails."' ERR
          keychain="$RUNNER_TEMP/signing.keychain-db"
          if [ ! -e "$keychain" ]; then
            echo "No job keychain, so no certificate to revoke."
            exit 0
          fi
          umask 077
          work=$(mktemp -d "$RUNNER_TEMP/revoke.XXXXXX")
          trap 'rm -rf "$work"' EXIT

          # Uppercase hex without leading zeros. A serial is a positive
          # integer (RFC 5280, 4.1.2.2); openssl prints it a byte at a
          # time, so it can start with 0, and Apple's API may not.
          normalize() {
            local s
            s=$(printf '%s' "$1" | tr '[:lower:]' '[:upper:]' | tr -cd '0-9A-F' | sed 's/^0*//')
            echo "${s:-0}"
          }

          # Identities: certificates whose private key is in the job
          # keychain, by SHA-1. find-identity lists them twice (all, then
          # valid only).
          security find-identity -p codesigning "$keychain" > "$work/identities"
          awk '$2 ~ /^[0-9A-F]{40}$/ && /"Apple Development: / { print $2 }' "$work/identities" | sort -u > "$work/hashes"

          # Every certificate in the keychain, one file each.
          security find-certificate -a -p "$keychain" > "$work/all.pem" 2>/dev/null || true
          awk -v dir="$work" '/-----BEGIN CERTIFICATE-----/ { n++ } n { print > (dir "/cert-" n ".pem") }' "$work/all.pem"
          : > "$work/serials"
          for pem in "$work"/cert-*.pem; do
            [ -e "$pem" ] || continue
            sha1=$(/usr/bin/openssl x509 -in "$pem" -noout -fingerprint -sha1 | sed 's/^.*=//' | tr -d ':' | tr '[:lower:]' '[:upper:]')
            subject=$(/usr/bin/openssl x509 -in "$pem" -noout -subject | sed 's/^subject= *//')
            serial=$(/usr/bin/openssl x509 -in "$pem" -noout -serial | sed 's/^serial=//')
            if grep -qxF -e "$sha1" "$work/hashes"; then
              printf '%s\t%s\n' "$(normalize "$serial")" "$subject" >> "$work/serials"
            elif [[ $subject == *"Apple Development:"* ]]; then
              echo "::warning::Not revoking $subject (serial $serial): its private key isn't in the job keychain."
            fi
          done

          fail() {
            echo "::error::$1 Check the account for a \"Created via API\" Apple Development certificate from this run (serials of the job's: $(cut -f1 "$work/serials" | tr '\n' ' ' | sed 's/ $//')) and revoke it in Certificates, Identifiers & Profiles, or the next run fails."
            exit 1
          }
          if [ "$(wc -l < "$work/serials")" -ne "$(wc -l < "$work/hashes")" ]; then
            fail "The job keychain has $(wc -l < "$work/hashes" | tr -d ' ') Apple Development identities but $(wc -l < "$work/serials" | tr -d ' ') of their certificates were read."
          fi
          snapshot="$RUNNER_TEMP/certs/before-ids"
          if [ ! -s "$work/serials" ] && [ ! -f "$snapshot" ]; then
            echo "No Apple Development certificate with its key in the job keychain, so none to revoke."
            exit 0
          fi
          if [ -s "$work/serials" ]; then
            echo "To revoke, by serial: $(cut -f1 "$work/serials" | tr '\n' ' ' | sed 's/ $//')"
          fi
          source "$RUNNER_TEMP/asc-api.sh"
          asc_dev_certs "$work/account" "$work" || fail "Couldn't list the account's certificates."

          : > "$work/revoked"
          failed=0
          while IFS=$'\t' read -r serial subject; do
            ids=()
            while IFS=$'\t' read -r id account_serial _; do
              if [ "$(normalize "$account_serial")" = "$serial" ]; then ids+=("$id"); fi
            done < "$work/account"
            if [ "${#ids[@]}" -ne 1 ]; then
              echo "::error::$subject (serial $serial) matches ${#ids[@]} Apple Development certificates on the account, not one, so it wasn't revoked. Revoke it in Certificates, Identifiers & Profiles, or the next run fails."
              failed=1
              continue
            fi
            id=${ids[0]}
            if ! [[ $id =~ ^[A-Za-z0-9]+$ ]]; then
              echo "::error::The account returned an unexpected id for serial $serial, so it wasn't revoked."
              failed=1
              continue
            fi
            # https://developer.apple.com/documentation/appstoreconnectapi/delete-v1-certificates-_id_
            status=$(asc_api DELETE "$asc_api_base/certificates/$id" "$work/auth" "$work/response") || status="no response"
            case "$status" in
              204) echo "Revoked $subject (serial $serial, id $id)."; echo "$id" >> "$work/revoked" ;;
              # Listed moments ago, so most likely a retry after a
              # revocation whose answer was lost.
              404) echo "$subject (serial $serial, id $id) wasn't found, so it's most likely revoked already."; echo "$id" >> "$work/revoked" ;;
              *)
                echo "::error::Revoking $subject (serial $serial, id $id) returned HTTP $status. $(/usr/bin/jq -r '[.errors[]? | .detail // .title] | join(" ")' "$work/response" 2>/dev/null || true) Revoke it in Certificates, Identifiers & Profiles, or the next run fails."
                failed=1
                ;;
            esac
          done < "$work/serials"

          # Certificates that appeared during the job and weren't revoked above.
          if [ -f "$snapshot" ]; then
            sort "$work/revoked" > "$work/revoked.sorted"
            cut -f1 "$work/account" | sort | comm -23 - "$snapshot" | comm -23 - "$work/revoked.sorted" > "$work/new"
            if [ -s "$work/new" ]; then
              while IFS= read -r id; do
                echo "::error::New Apple Development certificate $(awk -F'\t' -v id="$id" '$1 == id { printf "%s, serial %s, expires %s", $3, $2, $4 }' "$work/account") (id $id) appeared on the account during this run, and its key isn't in the job keychain, so it wasn't revoked. It may not be this job's (a development certificate is valid for a year, so the expiration date shows when it was made). If it is, revoke it in Certificates, Identifiers & Profiles, or the next run fails."
              done < "$work/new"
              failed=1
            else
              echo "No Apple Development certificate was left behind."
            fi
          fi
          exit "$failed"

      - name: Remove the key and the build
        if: always()
        run: rm -rf "$RUNNER_TEMP/asc-key.p8" "$RUNNER_TEMP/asc-api.sh" "$RUNNER_TEMP/app.xcarchive" "$RUNNER_TEMP/export" "$RUNNER_TEMP/export-check" "$RUNNER_TEMP/export-options-local.plist" "$RUNNER_TEMP/entitlements" "$RUNNER_TEMP/expected-groups.json" "$RUNNER_TEMP/certs" "$RUNNER_TEMP"/certs.* "$RUNNER_TEMP"/jwt.* "$RUNNER_TEMP/DerivedData" "$RUNNER_TEMP/tmp"

      - name: Remove the keychain and restore the account's
        if: always() && runner.environment == 'self-hosted'
        shell: bash
        run: |
          # Keep going if one part fails, and fail at the end.
          set +e
          failed=0
          if [ -e "$RUNNER_TEMP/signing.keychain-db" ]; then
            security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || failed=1
          fi

          state="$RUNNER_TEMP/signing"
          if [ -f "$state/keychains" ]; then
            keychains=()
            while IFS= read -r keychain; do
              keychains+=("$keychain")
            done < "$state/keychains"
            if [ "${#keychains[@]}" -gt 0 ]; then
              security list-keychains -d user -s "${keychains[@]}" || failed=1
            else
              security list-keychains -d user -s || failed=1
            fi
            if [ -s "$state/default-keychain" ]; then
              security default-keychain -d user -s "$(cat "$state/default-keychain")" || failed=1
            elif security default-keychain -d user > /dev/null 2>&1; then
              # There was none: unset it rather than leave the deleted one.
              # With none set, the command fails ("A default keychain could
              # not be found"), so it only runs when one is set.
              security default-keychain -d user -s || failed=1
            fi
          fi

          # Profiles are public, but the runner's home should look as it did.
          if [ -f "$state/profiles" ]; then
            for dir in "$HOME/Library/MobileDevice/Provisioning Profiles" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
              for profile in "$dir"/*; do
                if [ -e "$profile" ] && ! grep -qxF -e "$(basename "$profile")" "$state/profiles"; then
                  echo "Removing $profile"
                  rm -f "$profile" || failed=1
                fi
              done
            done
          fi

          # Whatever is new in ~/Library/Keychains, such as the data
          # protection keychain (<hardware UUID>/keychain-2.db), which can
          # hold an Apple Development key if signing made one. secd, the
          # account's keychain daemon, stays running between jobs with the
          # database open: removing the files alone would leave it serving
          # the old one to the next job, and unlinking an open SQLite
          # database can corrupt it (https://www.sqlite.org/howtocorrupt.html).
          # So stop secd first, remove the files, then stop it again in
          # case a process relaunched it in between, and fail if the job's
          # entries came back. launchd starts secd again when something
          # next asks for it.
          keychains_dir="$HOME/Library/Keychains"
          # Waits for the secd processes running now to exit, not for no
          # secd at all: launchd may start a new one at any time.
          stop_secd() {
            local pids=() pid alive
            while IFS= read -r pid; do pids+=("$pid"); done < <(pgrep -U "$(id -u)" -x secd)
            if [ "${#pids[@]}" -eq 0 ]; then return 0; fi
            kill -TERM "${pids[@]}"
            for _ in $(seq 1 20); do
              alive=0
              for pid in "${pids[@]}"; do
                if kill -0 "$pid" 2>/dev/null; then alive=1; fi
              done
              if [ "$alive" -eq 0 ]; then return 0; fi
              sleep 0.5
            done
            kill -KILL "${pids[@]}" 2>/dev/null
            sleep 1
            for pid in "${pids[@]}"; do
              if kill -0 "$pid" 2>/dev/null; then return 1; fi
            done
          }
          new_keychain_files() {
            if [ -d "$keychains_dir" ]; then
              find "$keychains_dir" -mindepth 1 -maxdepth 1 -exec basename {} \; | while IFS= read -r entry; do
                if [ -n "$entry" ] && ! grep -qxF -e "$entry" "$state/keychain-files"; then
                  echo "$entry"
                fi
              done
            fi
          }
          if [ -f "$state/keychain-files" ]; then
            stop_secd || { echo "::error::secd didn't stop."; failed=1; }
            # A few tries: secd's scheduled tasks can start it again, and
            # it recreates the folder.
            for _ in 1 2 3; do
              if [ -z "$(new_keychain_files)" ]; then break; fi
              while IFS= read -r entry; do
                echo "Removing $keychains_dir/$entry"
                rm -rf "${keychains_dir:?}/${entry:?}" || failed=1
              done < <(new_keychain_files)
              stop_secd || { echo "::error::secd didn't stop."; failed=1; }
            done
            if [ -n "$(new_keychain_files)" ]; then
              echo "::error::$keychains_dir still has entries the job made: $(new_keychain_files | tr '\n' ' ')"
              failed=1
            fi
          fi
          if [ -f "$state/no-keychains-dir" ] && [ -d "$keychains_dir" ]; then
            rmdir "$keychains_dir" || failed=1
          fi

          # Xcode's URL caches and HTTP stores. NSURLCache's Cache.db keeps
          # request headers, which can include the App Store Connect token
          # xcodebuild made from the key (valid up to 20 minutes).
          for path in \
            "$HOME/Library/Caches/com.apple.dt.xcodebuild" \
            "$HOME/Library/Caches/com.apple.dt.Xcode.ITunesSoftwareService" \
            "$HOME/Library/Caches/com.apple.itunes.swinfo" \
            "$HOME/Library/HTTPStorages/com.apple.dt.xcodebuild" \
            "$HOME/Library/HTTPStorages/com.apple.dt.Xcode.ITunesSoftwareService" \
            "$HOME/Library/HTTPStorages/com.apple.itunes.swinfo" \
            "$HOME/Library/Application Support/com.apple.dt.Xcode.ITunesSoftwareService"; do
            if [ -e "$path" ]; then
              echo "Removing $path"
              rm -rf "$path" || failed=1
            fi
          done
          rm -rf "$state"

          security list-keychains -d user
          security default-keychain -d user || echo "No default keychain."
          if [ "$failed" -ne 0 ]; then
            echo "::error::Cleanup didn't finish. Check this runner's keychains and profiles."
            exit 1
          fi

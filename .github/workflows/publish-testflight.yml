name: Publish TestFlight

# Archive an iOS app, sign it for distribution and upload it to App Store
# Connect, where it shows under TestFlight.
#
# Signing is automatic with certificates Apple keeps (cloud signing), so the
# runner holds no distribution certificate. xcodebuild signs in with an App
# Store Connect team API key whose role is Admin. The key comes from the
# calling repo's testflight environment, where Doppler syncs it:
#
#   vars.ASC_KEY_ID          The key's ID
#   vars.ASC_ISSUER_ID       The issuer ID of the team's keys
#   secrets.ASC_KEY_P8       The contents of the key's .p8 file
#
# The caller must pass the secret by name (ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}),
# even though it only exists in the environment.
#
# The Mac is the one the org variable RUNS_ON_MACOS_PUBLISH names, and
# GitHub's xcode-27 runner when it isn't set. It is never the CI pool
# (RUNS_ON_MACOS): those runners keep their accounts between jobs and run
# every pull request's build, so a dependency in any of them could leave a
# process behind that reads the key during a later upload. The job fails
# early on a CI pool runner (named echo-macaroni-<n>).
#
# A publish runner is one only publish jobs use, one runner per account,
# outside the CI pool: the keychain list and provisioning profiles are per
# account, so two runners sharing one would undo each other's. What keeps
# other workflows off it is the org runner group testflight-publish
# (selected repos tabstash-apple and rabbithole-apple, workflows limited to
# unstable-studios/.github/.github/workflows/publish-testflight.yml@refs/heads/main),
# not its label. The calling repo's own code on the allowed branch still
# runs there during the archive (build phases, package plugins), with the
# key on disk.
#
# The environment is always testflight, written into the job rather than
# taken as an input. The runner group limits the workflow and the repos, not
# the branch a caller runs on, so the environment's branch rule (main only)
# is what keeps workflows on other branches off the publish runner. If a
# caller could name another environment, a workflow on any branch could run
# this job there: no key, but on the publish runner, where it could change
# the account's files before the next real upload.
#
# Create the testflight environment with its main branch rule before adding
# a repo to the testflight-publish runner group; GitHub creates a missing
# environment on first use with no protection rules.
#
# A self-hosted runner keeps its home folder between jobs, so there the job
# signs with a keychain of its own in $RUNNER_TEMP and its last step
# deletes it, restores the account's keychain list and default, and
# removes any provisioning profile it downloaded. It also removes anything
# new in ~/Library/Keychains: the first xcodebuild call can make macOS
# create the account's data protection keychain there (a folder named
# with the Mac's hardware UUID), which the search list doesn't cover and
# which may hold the Apple Development key. secd, the account's keychain
# daemon, keeps that database open between jobs and can start again
# between them, so the job stops it at the start, removes any data
# protection keychain an earlier job left, and stops it again around the
# final removal. Cleanup also deletes Xcode's URL caches and HTTP stores
# (com.apple.dt.xcodebuild, com.apple.dt.Xcode.ITunesSoftwareService and
# com.apple.itunes.swinfo under ~/Library/Caches and ~/Library/HTTPStorages,
# and ~/Library/Application Support/com.apple.dt.Xcode.ITunesSoftwareService):
# a URL cache keeps request headers, which can include the App Store
# Connect token made from the key. What stays: SwiftPM's caches
# (~/Library/Caches/org.swift.swiftpm, ~/Library/org.swift.swiftpm and
# ~/.swiftpm, which links to them), which hold clones of the app's
# package dependencies, their fingerprints and parsed manifests but no
# credentials, and Xcode's preferences. The job also leaves
# ~/Library/Developer/CoreSimulator, ~/Library/Developer/DVTDownloads,
# ~/Library/Caches/com.apple.cds*, ~/Library/Logs/CoreSimulator and
# ~/Library/Containers/com.apple.CoreDevice.*, none of which holds
# credentials. On GitHub's runners signing uses the login keychain, as
# before. On both, the build goes to $RUNNER_TEMP and the key and build
# are deleted at the end.

on:
  workflow_call:
    inputs:
      project:
        description: "Path to the .xcodeproj"
        type: string
        required: true
      scheme:
        description: "Scheme to archive"
        type: string
        required: true
      ref:
        description: "Commit, tag or branch to build. Empty builds the commit the caller ran for. Pass release-please's sha so the build is the tagged commit."
        type: string
        default: ""
      version:
        description: "Version people see, such as 1.2.3. Empty reads the root package's version from the release-please manifest."
        type: string
        default: ""
      manifest-file:
        description: "Path to .release-please-manifest.json, read when version is empty"
        type: string
        default: ".release-please-manifest.json"
      build-number:
        description: "Build number, higher than any uploaded for this version. Empty uses the time in UTC, as YYYYMMDDHHMM."
        type: string
        default: ""
      export-options:
        description: "Path to the export options plist (method app-store-connect, destination upload)"
        type: string
        default: "Config/TestFlight-ExportOptions.plist"
      runs-on:
        description: "Runner label. It must have the Xcode at xcode-path. Empty uses vars.RUNS_ON_MACOS_PUBLISH, or GitHub's xcode-27 when that isn't set. Never a runner that also runs CI."
        type: string
        default: ""
      xcode-path:
        description: "Path to the Xcode app to build with"
        type: string
        default: "/Applications/Xcode_27.2.app"
      timeout-minutes:
        description: "Job timeout"
        type: number
        default: 45
    secrets:
      ASC_KEY_P8:
        description: "Contents of the App Store Connect API key's .p8 file"
        required: true
    outputs:
      version:
        description: "The version that was uploaded"
        value: ${{ jobs.upload.outputs.version }}
      build-number:
        description: "The build number that was uploaded"
        value: ${{ jobs.upload.outputs.build-number }}

# Scoped to the calling repo: one upload per repo at a time. Uploads from
# different repos can run at once if the publish runners allow it.
concurrency:
  group: publish-testflight
  cancel-in-progress: false

jobs:
  upload:
    name: Upload to TestFlight
    # In the job, not as the input's default, so passing runs-on still wins.
    # vars are the calling repo's. Not RUNS_ON_MACOS: see the top of the file.
    runs-on: ${{ inputs.runs-on || vars.RUNS_ON_MACOS_PUBLISH || 'xcode-27' }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    # Holds the key. Its rules decide which branches and tags may use it,
    # and so which may run on the publish runner. Fixed: see the top of the
    # file.
    environment: testflight
    permissions:
      contents: read
    outputs:
      version: ${{ steps.plan.outputs.version }}
      build-number: ${{ steps.plan.outputs.build }}
    env:
      DEVELOPER_DIR: ${{ inputs.xcode-path }}/Contents/Developer
    steps:
      - name: Refuse a CI pool runner
        if: runner.environment == 'self-hosted'
        env:
          NAME: ${{ runner.name }}
        run: |
          if [[ $NAME =~ ^echo-macaroni-[0-9]+$ ]]; then
            echo "::error::$NAME is in the CI pool, which runs pull requests' code. Publish from a runner only publish jobs use (RUNS_ON_MACOS_PUBLISH)."
            exit 1
          fi

      # Self-hosted only, and before anything runs Xcode's tools: the
      # first xcodebuild call can make macOS create the account's data
      # protection keychain, ~/Library/Keychains/<hardware UUID>, which
      # the keychain search list doesn't cover. Cleanup removes whatever
      # is new in that folder.
      - name: Record the account's keychain folder
        if: runner.environment == 'self-hosted'
        shell: bash
        run: |
          state="$RUNNER_TEMP/signing"
          mkdir -p "$state"
          # Waits for the secd processes running now to exit, not for no
          # secd at all: launchd may start a new one at any time.
          stop_secd() {
            local pids=() pid alive
            while IFS= read -r pid; do pids+=("$pid"); done < <(pgrep -U "$(id -u)" -x secd)
            if [ "${#pids[@]}" -eq 0 ]; then return 0; fi
            kill -TERM "${pids[@]}"
            for _ in $(seq 1 20); do
              alive=0
              for pid in "${pids[@]}"; do
                if kill -0 "$pid" 2>/dev/null; then alive=1; fi
              done
              if [ "$alive" -eq 0 ]; then return 0; fi
              sleep 0.5
            done
            kill -KILL "${pids[@]}" 2>/dev/null
            sleep 1
            for pid in "${pids[@]}"; do
              if kill -0 "$pid" 2>/dev/null; then return 1; fi
            done
          }
          # secd, the account's keychain daemon, keeps running between
          # jobs, and its scheduled tasks can start it again after cleanup
          # stopped it, recreating the data protection keychain. Stop it,
          # and wait for it to exit, before removing that keychain:
          # unlinking an open SQLite database can corrupt it
          # (https://www.sqlite.org/howtocorrupt.html). launchd starts it
          # again when something next asks for it.
          stop_secd || { echo "::error::secd didn't stop."; exit 1; }
          keychains_dir="$HOME/Library/Keychains"
          for entry in "$keychains_dir"/*-*-*-*-*; do
            if [ -d "$entry" ]; then
              echo "Removing $entry, left from an earlier job"
              rm -rf "$entry" || { echo "::error::Couldn't remove $entry."; exit 1; }
            fi
          done
          if [ -d "$keychains_dir" ]; then
            # Not the <UUID> folders: one recreated since the removal above
            # isn't the account's own, and cleanup must not keep it. Files
            # with that shape of name stay, as the removal leaves them.
            find "$keychains_dir" -mindepth 1 -maxdepth 1 ! \( -type d -name '*-*-*-*-*' \) -exec basename {} \; > "$state/keychain-files.new"
          else
            : > "$state/keychain-files.new"
            # Cleanup removes the folder the job creates.
            touch "$state/no-keychains-dir"
          fi
          # Last: cleanup removes entries only when this file exists.
          mv "$state/keychain-files.new" "$state/keychain-files"

      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Work out the version and build number
        id: plan
        env:
          VERSION: ${{ inputs.version }}
          BUILD: ${{ inputs.build-number }}
          MANIFEST_FILE: ${{ inputs.manifest-file }}
        run: |
          if [ -z "$VERSION" ]; then
            if [ ! -f "$MANIFEST_FILE" ]; then
              echo "::error::No version was given and there is no manifest at $MANIFEST_FILE."
              exit 2
            fi
            VERSION=$(/usr/bin/python3 -c 'import json, sys; print(json.load(open(sys.argv[1])).get(".", ""))' "$MANIFEST_FILE")
          fi
          # The time, to the minute. It only ever rises, whichever workflow
          # calls this and however often it is re-run or renamed, so no two
          # uploads of a version share a build number.
          if [ -z "$BUILD" ]; then
            BUILD=$(date -u +%Y%m%d%H%M)
          fi
          number='(0|[1-9][0-9]*)'
          if ! [[ $VERSION =~ ^$number\.$number\.$number$ ]]; then
            echo "::error::The version must look like 1.2.3, not '$VERSION'."
            exit 2
          fi
          if ! [[ $BUILD =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::The build number must be a whole number above zero, not '$BUILD'."
            exit 2
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"

      # Self-hosted only: a keychain for this job, and the only one
      # xcodebuild sees, so anything signing creates (an Apple Development
      # key, for one) goes there and is deleted with it. The account's own
      # list is restored at the end.
      - name: Create a keychain for this job
        if: runner.environment == 'self-hosted'
        shell: bash
        run: |
          state="$RUNNER_TEMP/signing"
          mkdir -p "$state"
          # The account's list and default, without any job keychain an
          # earlier job failed to remove, and only keychains that exist.
          unquote() { sed -e 's/^ *"//' -e 's/"$//'; }
          keep() {
            while IFS= read -r keychain; do
              case "$keychain" in
                ""|*/_temp/*|*/signing.keychain-db) ;;
                *) if [ -e "$keychain" ]; then echo "$keychain"; fi ;;
              esac
            done
          }
          # Each file is moved into place only once it is complete, so
          # cleanup never restores a list a failed command left empty.
          security list-keychains -d user | unquote | keep > "$state/keychains.new"
          { security default-keychain -d user 2>/dev/null || true; } | unquote | keep > "$state/default-keychain.new"
          for dir in "$HOME/Library/MobileDevice/Provisioning Profiles" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
            for profile in "$dir"/*; do
              if [ -e "$profile" ]; then basename "$profile"; fi
            done
          done > "$state/profiles.new"
          mv "$state/default-keychain.new" "$state/default-keychain"
          mv "$state/profiles.new" "$state/profiles"
          # Last: cleanup restores only when this file exists.
          mv "$state/keychains.new" "$state/keychains"

          keychain="$RUNNER_TEMP/signing.keychain-db"
          # Never written down: the keychain is deleted at the end of the job.
          password=$(openssl rand -hex 32)
          security create-keychain -p "$password" "$keychain"
          # No auto-lock: a long archive mustn't find it locked.
          security set-keychain-settings "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security list-keychains -d user -s "$keychain"
          security default-keychain -d user -s "$keychain"
          security list-keychains -d user

      - name: Write the App Store Connect key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          # Empty when it is missing from the environment, was synced as a
          # variable, or the caller didn't pass it.
          : "${ASC_KEY_P8:?ASC_KEY_P8 is not a secret in this environment, or the caller did not pass it.}"
          umask 077
          printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/asc-key.p8"
          if ! grep -q "PRIVATE KEY" "$RUNNER_TEMP/asc-key.p8"; then
            echo "::error::ASC_KEY_P8 isn't an API key (.p8)."
            exit 2
          fi

      - name: Archive, sign and upload
        env:
          # Identifiers, not secrets: Doppler syncs unmasked values to
          # GitHub as variables. They show in this job's log.
          ASC_KEY_ID: ${{ vars.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ vars.ASC_ISSUER_ID }}
          PROJECT: ${{ inputs.project }}
          SCHEME: ${{ inputs.scheme }}
          EXPORT_OPTIONS: ${{ inputs.export-options }}
          VERSION: ${{ steps.plan.outputs.version }}
          BUILD: ${{ steps.plan.outputs.build }}
          # Distribution logs and export staging, which would otherwise
          # stay in the account's temporary folder.
          TMPDIR: ${{ runner.temp }}/tmp
        run: |
          mkdir -p "$TMPDIR"
          : "${ASC_KEY_ID:?ASC_KEY_ID is not a variable in this environment.}"
          : "${ASC_ISSUER_ID:?ASC_ISSUER_ID is not a variable in this environment.}"
          sign_in=(
            -allowProvisioningUpdates
            -authenticationKeyPath "$RUNNER_TEMP/asc-key.p8"
            -authenticationKeyID "$ASC_KEY_ID"
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          )
          archive="$RUNNER_TEMP/app.xcarchive"
          # Not ~/Library/Developer/Xcode/DerivedData, which outlives the job
          # on the pool.
          derived="$RUNNER_TEMP/DerivedData"

          # The app and its extensions must carry the same version and
          # build, so both are set for every target here.
          xcodebuild archive \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$archive" \
            -derivedDataPath "$derived" \
            MARKETING_VERSION="$VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD" \
            "${sign_in[@]}"

          # "upload" in the options sends it to App Store Connect.
          xcodebuild -exportArchive \
            -archivePath "$archive" \
            -exportOptionsPlist "$EXPORT_OPTIONS" \
            -exportPath "$RUNNER_TEMP/export" \
            "${sign_in[@]}"

          echo "Uploaded $SCHEME $VERSION ($BUILD) to App Store Connect." >> "$GITHUB_STEP_SUMMARY"

      - name: Remove the key and the build
        if: always()
        run: rm -rf "$RUNNER_TEMP/asc-key.p8" "$RUNNER_TEMP/app.xcarchive" "$RUNNER_TEMP/export" "$RUNNER_TEMP/DerivedData" "$RUNNER_TEMP/tmp"

      - name: Remove the keychain and restore the account's
        if: always() && runner.environment == 'self-hosted'
        shell: bash
        run: |
          # Keep going if one part fails, and fail at the end.
          set +e
          failed=0
          if [ -e "$RUNNER_TEMP/signing.keychain-db" ]; then
            security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || failed=1
          fi

          state="$RUNNER_TEMP/signing"
          if [ -f "$state/keychains" ]; then
            keychains=()
            while IFS= read -r keychain; do
              keychains+=("$keychain")
            done < "$state/keychains"
            if [ "${#keychains[@]}" -gt 0 ]; then
              security list-keychains -d user -s "${keychains[@]}" || failed=1
            else
              security list-keychains -d user -s || failed=1
            fi
            if [ -s "$state/default-keychain" ]; then
              security default-keychain -d user -s "$(cat "$state/default-keychain")" || failed=1
            elif security default-keychain -d user > /dev/null 2>&1; then
              # There was none: unset it rather than leave the deleted one.
              # With none set, the command fails ("A default keychain could
              # not be found"), so it only runs when one is set.
              security default-keychain -d user -s || failed=1
            fi
          fi

          # Profiles are public, but the runner's home should look as it did.
          if [ -f "$state/profiles" ]; then
            for dir in "$HOME/Library/MobileDevice/Provisioning Profiles" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
              for profile in "$dir"/*; do
                if [ -e "$profile" ] && ! grep -qxF -e "$(basename "$profile")" "$state/profiles"; then
                  echo "Removing $profile"
                  rm -f "$profile" || failed=1
                fi
              done
            done
          fi

          # Whatever is new in ~/Library/Keychains, such as the data
          # protection keychain (<hardware UUID>/keychain-2.db), which can
          # hold the Apple Development key signing made. secd, the
          # account's keychain daemon, stays running between jobs with the
          # database open: removing the files alone would leave it serving
          # the old one to the next job, and unlinking an open SQLite
          # database can corrupt it (https://www.sqlite.org/howtocorrupt.html).
          # So stop secd first, remove the files, then stop it again in
          # case a process relaunched it in between, and fail if the job's
          # entries came back. launchd starts secd again when something
          # next asks for it.
          keychains_dir="$HOME/Library/Keychains"
          # Waits for the secd processes running now to exit, not for no
          # secd at all: launchd may start a new one at any time.
          stop_secd() {
            local pids=() pid alive
            while IFS= read -r pid; do pids+=("$pid"); done < <(pgrep -U "$(id -u)" -x secd)
            if [ "${#pids[@]}" -eq 0 ]; then return 0; fi
            kill -TERM "${pids[@]}"
            for _ in $(seq 1 20); do
              alive=0
              for pid in "${pids[@]}"; do
                if kill -0 "$pid" 2>/dev/null; then alive=1; fi
              done
              if [ "$alive" -eq 0 ]; then return 0; fi
              sleep 0.5
            done
            kill -KILL "${pids[@]}" 2>/dev/null
            sleep 1
            for pid in "${pids[@]}"; do
              if kill -0 "$pid" 2>/dev/null; then return 1; fi
            done
          }
          new_keychain_files() {
            if [ -d "$keychains_dir" ]; then
              find "$keychains_dir" -mindepth 1 -maxdepth 1 -exec basename {} \; | while IFS= read -r entry; do
                if [ -n "$entry" ] && ! grep -qxF -e "$entry" "$state/keychain-files"; then
                  echo "$entry"
                fi
              done
            fi
          }
          if [ -f "$state/keychain-files" ]; then
            stop_secd || { echo "::error::secd didn't stop."; failed=1; }
            # A few tries: secd's scheduled tasks can start it again, and
            # it recreates the folder.
            for _ in 1 2 3; do
              if [ -z "$(new_keychain_files)" ]; then break; fi
              while IFS= read -r entry; do
                echo "Removing $keychains_dir/$entry"
                rm -rf "${keychains_dir:?}/${entry:?}" || failed=1
              done < <(new_keychain_files)
              stop_secd || { echo "::error::secd didn't stop."; failed=1; }
            done
            if [ -n "$(new_keychain_files)" ]; then
              echo "::error::$keychains_dir still has entries the job made: $(new_keychain_files | tr '\n' ' ')"
              failed=1
            fi
          fi
          if [ -f "$state/no-keychains-dir" ] && [ -d "$keychains_dir" ]; then
            rmdir "$keychains_dir" || failed=1
          fi

          # Xcode's URL caches and HTTP stores. NSURLCache's Cache.db keeps
          # request headers, which can include the App Store Connect token
          # xcodebuild made from the key (valid up to 20 minutes).
          for path in \
            "$HOME/Library/Caches/com.apple.dt.xcodebuild" \
            "$HOME/Library/Caches/com.apple.dt.Xcode.ITunesSoftwareService" \
            "$HOME/Library/Caches/com.apple.itunes.swinfo" \
            "$HOME/Library/HTTPStorages/com.apple.dt.xcodebuild" \
            "$HOME/Library/HTTPStorages/com.apple.dt.Xcode.ITunesSoftwareService" \
            "$HOME/Library/HTTPStorages/com.apple.itunes.swinfo" \
            "$HOME/Library/Application Support/com.apple.dt.Xcode.ITunesSoftwareService"; do
            if [ -e "$path" ]; then
              echo "Removing $path"
              rm -rf "$path" || failed=1
            fi
          done
          rm -rf "$state"

          security list-keychains -d user
          security default-keychain -d user || echo "No default keychain."
          if [ "$failed" -ne 0 ]; then
            echo "::error::Cleanup didn't finish. Check this runner's keychains and profiles."
            exit 1
          fi
